server {
    listen 80;
    server_name srv1563194.hstgr.cloud;
    return 301 https://$host:4443$request_uri;
}

server {
    listen 443 ssl;
    server_name srv1563194.hstgr.cloud;

    ssl_certificate /etc/letsencrypt/live/srv1563194.hstgr.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/srv1563194.hstgr.cloud/privkey.pem;

    location / {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        proxy_pass http://app:8000/static/;
    }
}
