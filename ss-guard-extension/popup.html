<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 420px; max-height: 520px; font-family: 'Segoe UI', system-ui, sans-serif; font-size: 12px; background: #fff; color: #333; }
  .header { padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; }
  .header h1 { font-size: 15px; font-weight: 600; color: #111; letter-spacing: -0.3px; }
  .badge { background: #e8353e; color: #fff; font-size: 10px; font-weight: 700; min-width: 20px; height: 20px; line-height: 20px; text-align: center; border-radius: 10px; padding: 0 6px; }
  .actions { padding: 0 16px 10px; display: flex; gap: 6px; }
  .actions button { background: none; border: 1px solid #ddd; color: #555; font-size: 11px; padding: 5px 12px; border-radius: 20px; cursor: pointer; transition: all 0.15s; }
  .actions button:hover { border-color: #999; color: #111; }
  .divider { height: 1px; background: #eee; }
  .list { overflow-y: auto; max-height: 400px; }
  .entry { padding: 12px 16px; transition: background 0.1s; }
  .entry + .entry { border-top: 1px solid #f3f3f3; }
  .entry:hover { background: #f9f9f9; }
  .entry-top { display: flex; justify-content: space-between; align-items: baseline; }
  .entry-asin { font-weight: 600; color: #111; font-size: 12px; }
  .entry-asin .shipment { color: #888; font-weight: 400; }
  .entry-param { font-size: 15px; font-weight: 700; color: #111; font-variant-numeric: tabular-nums; }
  .entry-desc { color: #666; margin-top: 3px; line-height: 1.35; font-size: 11px; }
  .entry-bottom { display: flex; justify-content: space-between; align-items: center; margin-top: 5px; }
  .entry-nums { font-size: 11px; color: #888; }
  .entry-shade { color: #e8353e; font-weight: 600; }
  .entry-meta { font-size: 10px; color: #aaa; text-align: right; }
  .empty { padding: 50px 20px; text-align: center; color: #bbb; font-size: 13px; }
</style>
</head>
<body>
  <div class="header">
    <h1>Сянка</h1>
    <span class="badge" id="badge">0</span>
  </div>
  <div class="actions">
    <button id="mark-read">&#x2713; Прочетени</button>
    <button id="refresh">&#x21BB; Обнови</button>
  </div>
  <div class="divider"></div>
  <div class="list" id="list"></div>
  <script src="popup.js"></script>
</body>
</html>
